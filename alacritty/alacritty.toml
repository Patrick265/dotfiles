general.import = [ "~/.config/alacritty/default-themes/themes/kanagawa_dragon.toml" ]
general.live_config_reload = true

[terminal.shell]
program = "/usr/bin/zsh"
# args = [ "-l", "-c", "tmux" ] 

[window]
padding.x = 5
padding.y = 5
decorations = "Full"
opacity = 1.0

[cursor]
style = { shape = "Beam", blinking = "Always" } 
vi_mode_style = "None"
unfocused_hollow = false

[font]
size   = 10.25
normal = { family = "SF Mono", style = "Regular" } 
bold   = { family = "SF Mono", style = "Bold" } 
